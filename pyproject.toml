[project]
name = "mvo-cluster-scan"
version = "0.1.0"
description = "Production-safe local MVO cluster scanner"
requires-python = ">=3.9"

[project.scripts]
mvo-schedule = "mvo_schedule.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
